name: Draft Canvas
on:
  push:
    branches: [main, 'feat/draft-canvas']
    paths: ['android-canvas/**', 'android-native/app/src/main/java/**', '.github/workflows/canvas.yml']
  pull_request:
    paths: ['android-canvas/**', 'android-native/app/src/main/java/**', '.github/workflows/canvas.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canvas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: cd android-canvas && ./gradlew testStandardDebugUnitTest testXiaomiDebugUnitTest lintStandardDebug lintXiaomiDebug assembleStandardDebug assembleStandardDebugAndroidTest assembleXiaomiDebug assembleXiaomiDebugAndroidTest --no-daemon
      - name: Signed release
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PADPASTE_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          PADPASTE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/padpaste.p12"
          export PADPASTE_KEYSTORE="$RUNNER_TEMP/padpaste.p12"
          cd android-canvas && ./gradlew assembleStandardRelease assembleXiaomiRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: draftcanvas-apks
          path: |
            android-canvas/app/build/outputs/apk/**/*.apk
