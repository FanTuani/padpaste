name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  client-and-configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --check android/PadPaste.js
      - run: node --test tests/formats.test.js
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: for script in scripts/*.sh; do bash -n "$script"; done
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: test "$(uname -m)" = arm64
      - run: bash scripts/build-macos.sh
      - run: python3 tests/integration.py
      - run: bash scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: padpaste-macos-arm64
          path: |
            dist/padpaste-*.zip
            dist/SHA256SUMS

  android-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: cd android-native && ./gradlew assembleDebug lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: padpaste-android-debug
          path: android-native/app/build/outputs/apk/debug/*.apk
