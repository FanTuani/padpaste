name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: test "$(uname -m)" = arm64
      - run: test "${GITHUB_REF_NAME#v}" = "$(cat VERSION)"
      - run: bash scripts/build-macos.sh
      - run: python3 tests/integration.py
      - run: bash scripts/package.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/padpaste-*.zip dist/SHA256SUMS \
            --title "PadPaste $GITHUB_REF_NAME" \
            --generate-notes --verify-tag
